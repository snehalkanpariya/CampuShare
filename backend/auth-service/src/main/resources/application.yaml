server:
  port: 8081

spring:
  application:
    name: auth-service

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

  data:
    mongodb:
      uri: mongodb://localhost:27017/auth_db
      database: auth_db

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/campusshare

keycloak:
  auth-server-url: http://localhost:8180
  realm: campusshare
  admin:
    username: admin
    password: admin123
    client-id: admin-cli

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/