server:
  port: 8083

spring:
  application:
    name: item-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/campusshare_db

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
