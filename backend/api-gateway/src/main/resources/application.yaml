server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/api/auth/**
          - id: auth-test
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/api/test/**
          - id: verification-service
            uri: lb://VERIFICATION-SERVICE
            predicates:
              - Path=/api/verify/**
          - id: item-service
            uri: lb://ITEM-SERVICE
            predicates:
              - Path=/api/items/**
          - id: request-service
            uri: lb://ITEM-SERVICE
            predicates:
              - Path=/api/requests/**
          - id: notification-service
            uri: lb://ITEM-SERVICE
            predicates:
              - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/