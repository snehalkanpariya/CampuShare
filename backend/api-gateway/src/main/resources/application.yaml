server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: lb://AUTH-SERVICE
            predicates:
              - Path=/api/auth/**, /api/test/**, /api/users/**
          - id: verification-service
            uri: lb://VERIFICATION-SERVICE
            predicates:
              - Path=/api/verify/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/