server:
  port: 8082

spring:
  application:
    name: verification-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/auth_db
      database: auth_db

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:campusshare.gvp@gmail.com}
    password: ${MAIL_PASSWORD:secret}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
